// ===== CẤU HÌNH NHỊP THỊ TRƯỜNG (chỉnh tốc độ tại đây, không cần sửa code khác) =====
// 1 tick = TICK_MS ms (10s) theo đồng hồ chung => 5-7 tick ≈ 1 phút. Mỗi tài sản chỉ biến động giá chính sau mỗi MOVE_MIN..MOVE_MAX tick.
// UI_MS chỉ là chu kỳ vẽ lại giao diện/xử lý lệnh, KHÔNG tạo thêm tick hay biến động giá.
const CFG={TICK_MS:10000,UI_MS:1000,HIST:1500,MOVE_MIN:5,MOVE_MAX:7,VOL_SCALE:1.6,FLAT_P:.25,FLAT_SCALE:.15,MOMENTUM:.3,Z_CAP:2.2,REVERT:5e-4}; // REVERT: lực kéo nhẹ về giá gốc mỗi tick (thay cho drift cộng dồn cũ làm giá tăng ~5,6 lần/ngày); đặt 0 để tắt
const FEE=.001,SLIP=.0005,SES=390;let tick=0;const M={};
const rng=s=>()=>{s=(s+0x6D2B79F5)>>>0;let t=Math.imul(s^s>>>15,s|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const EPOCH=Date.UTC(2026,9,18),TT=()=>400+Math.max(0,Math.floor((Date.now()-EPOCH)/CFG.TICK_MS));
const gap=r=>CFG.MOVE_MIN+Math.floor(r()*(CFG.MOVE_MAX-CFG.MOVE_MIN+1));
// Mỗi tick: mọi tài sản đều ghi 1 nến, nhưng giá chỉ đổi khi tới lượt (m.nx). Số lần rút rng mỗi tick cố định => mọi thiết bị cho cùng kết quả.
function step(keep=true){tick++;let any=0;for(const x of INS){const m=M[x[0]],r=m.r,o=m.p;let c=o,mv=0,z=0,sc=1;
 if(tick>=m.nx){const n=Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());z=Math.max(-CFG.Z_CAP,Math.min(CFG.Z_CAP,(1-CFG.MOMENTUM)*n+CFG.MOMENTUM*m.z));m.z=z;sc=r()<CFG.FLAT_P?CFG.FLAT_SCALE:1;c=o*Math.exp(x[4]*CFG.VOL_SCALE*sc*z+CFG.REVERT*(tick-m.lt)*Math.log(x[3]/o));m.lt=tick;m.nx=tick+gap(r);mv=1;any=1}
 const a=r(),b=r(),d=r();if(keep){m.c.push({o,h:Math.max(o,c)*(1+mv*a*x[4]*.4*sc),l:Math.min(o,c)*(1-mv*b*x[4]*.4*sc),c,v:Math.round(mv?1000*(.5+d)*(1+Math.abs(z)):120*(.5+d))});if(m.c.length>CFG.HIST)m.c.shift()}m.p=c}return any}
INS.forEach((x,i)=>{const r=rng(1000+i*17);M[x[0]]={r,c:[],p:x[3],z:0,lt:0,nx:1+Math.floor(r()*CFG.MOVE_MAX)}});{const t0=TT();while(tick<t0)step(tick>=t0-CFG.HIST)}
const I=s=>INS.find(x=>x[0]==s),px=s=>M[s].p,dec=s=>I(s)[5];
function chg(s){const m=M[s],ref=m.c[Math.max(0,m.c.length-1-tick%SES)].o;return[m.p-ref,(m.p-ref)/ref*100]}
const vol=s=>M[s].c.slice(-(tick%SES||1)).reduce((a,c)=>a+c.v*c.c,0);

 DB.collection('lb').onSnapshot(sn=>{LB=sn.docs.map(x=>({uid:x.id,a:(x.data()||{}).accts||{}}));if(me&&(cur=='lead'||cur=='port'))upd()},e=>{lbErr=e.code||'err'});syncLB()}catch(e){}}

 try{const ref=DB.doc('lb/'+UID),body={accts:{[a.id]:{...e,t:Date.now()}}};if(!docOk){const sn=await ref.get();docOk=sn.exists?1:2}
  if(docOk==2){await ref.set(body);docOk=1}else await ref.update(body);lastK[a.id]=k}

 $('#wm')&&($('#wm').onclick=()=>{wc+=60;updT()});$('#wl').querySelectorAll('[data-s]').forEach(r=>r.onclick=e=>{if(e.target.dataset.w){const k=e.target.dataset.w,i=a.watch.indexOf(k);i<0?a.watch.push(k):a.watch.splice(i,1);save()}else{sym=r.dataset.s;setDef()}updT();if(!e.target.dataset.w)upd()});

 else if(bt=='ord')h=tbl(['ID','Mã','Bên','Loại','SL','Giá',''],a.orders.map(o=>`<tr><td>${o.id}</td><td>${o.sym}</td><td>${o.side=='buy'?'Mua':'Bán'}</td><td>${o.type}</td><td class="n">${fm(o.q,4)}</td><td class="n">${fm(o.price,dec(o.sym))}</td><td><button data-x="${o.id}">Hủy</button></td></tr>`),'Không có lệnh chờ.');

 else h=tbl(['Tick','Loại','Số tiền','Số dư','Tham chiếu'],a.ledger.slice(-60).reverse().map(e=>`<tr><td>${e.tick}</td><td>${e.type}</td><td class="n ${cc(e.amt)}">${sg(e.amt)}</td><td class="n">${fm(e.bal)}</td><td>${E(e.ref)} ${E(e.note)}</td></tr>`),'Chưa có bút toán.');

 $('#pp').innerHTML=`<div class="grid">${[['Tài sản ròng',fm(eq)],['Tiền mặt',fm(a.cash)],['Giá trị vị thế',fm(pv)],['Lãi/lỗ đã thực hiện',sg(a.realized),cc(a.realized)],['Lãi/lỗ chưa thực hiện',sg(un),cc(un)],['Tổng lợi nhuận',sg(pl)+' ('+sg(pl/a.init*100)+'%)',cc(pl)],['Thứ hạng chung','#'+rk+'/'+R.length]].map(k=>`<div class="kpi"><span class="mu">${k[0]}</span><b class="n ${k[2]||''}">${k[1]}</b></div>`).join('')}</div>
 <div class="box" style="margin-top:8px"><b>Đường cong tài sản</b> <span class="mu">(mẫu mỗi 5 tick)</span><canvas id="ec" style="width:100%;height:200px"></canvas></div>
 <div class="box" style="margin-top:8px"><b>Phân bổ theo loại</b>${tbl(['Loại','Giá trị','Tỷ trọng'],[['Tiền mặt',a.cash],...Object.entries(by)].map(([k,v])=>`<tr><td>${k}</td><td class="n">${fm(v)}</td><td class="n">${fm(v/eq*100)}%</td></tr>`),'')}</div><p class="mu">Tổng tài sản = tiền mặt + giá trị thị trường vị thế. Đóng vị thế ở tab Terminal.</p>`;
 const[g,w,h]=cs($('#ec')),d=a.eq;if(d.length>1){const lo=Math.min(...d.map(x=>x[1])),hi=Math.max(...d.map(x=>x[1]))||1;g.beginPath();d.forEach((x,i)=>{const X=i*(w-10)/(d.length-1)+5,Y=h-10-(x[1]-lo)/((hi-lo)||1)*(h-20);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.strokeStyle=css('--ac');g.stroke();g.fillStyle=css('--mu');g.fillText(fm(hi),5,10);g.fillText(fm(lo),5,h-1)}else{g.fillStyle=css('--mu');g.fillText('Chưa đủ dữ liệu — để mô phỏng chạy thêm',10,30)}}

 $('#mt').innerHTML=tbl(['Mã','Tên','Giá','Thay đổi','%','Giá trị GD','Xu hướng',''],l.slice(0,60).map(x=>{const[c,p]=chg(x[0]);return`<tr><td><b>${x[0]}</b></td><td>${E(x[1])}</td><td class="n">${fm(px(x[0]),x[5])}</td><td class="n ${cc(c)}">${sg(c)}</td><td class="n ${cc(c)}">${sg(p)}%</td><td class="n">${fm(vol(x[0]),0)}</td><td>${spark(M[x[0]].c.slice(-40).map(k=>k.c))}</td><td><button data-w="${x[0]}">${a.watch.includes(x[0])?'Bỏ ★':'+ ★'}</button> <button data-o="${x[0]}">Biểu đồ</button></td></tr>`}),'Không có dữ liệu.');
 $('#mt').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const k=b.dataset.w,i=a.watch.indexOf(k);i<0?a.watch.push(k):a.watch.splice(i,1);save();updM()});$('#mt').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sym=b.dataset.o;go('term')})}
